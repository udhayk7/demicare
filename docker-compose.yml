version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: demicare_postgres
    restart: always
    environment:
      POSTGRES_USER: demicare_user
      POSTGRES_PASSWORD: demicare_password
      POSTGRES_DB: demicare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demicare_user -d demicare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demicare_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://demicare_user:demicare_password@db:5432/demicare
      JWT_SECRET: supersecretjwtkey_demicare_hackathon_2026_change_in_production
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
